# Niveau maximum autorisé (1 à 255)
max-level: 255

anvil:
  # Autoriser n'importe quel enchantement sur n'importe quel objet via l'enclume
  unrestricted: true
  # Coût fixe en niveaux d'XP pour une combinaison
  cost: 5
  # Si deux enchantements identiques de même niveau : +1 niveau (comme vanilla)
  merge-same-level-upgrade: true

enchanting-table:
  # Désactive complètement la table d'enchantement
  disabled: true
  message: "&cLa table d'enchantement est désactivée sur ce serveur."

# Infinity en main secondaire : l'objet n'est jamais consommé
infinity-offhand:
  enabled: true
  items:
    - GOLDEN_APPLE
    - ENCHANTED_GOLDEN_APPLE
    - TOTEM_OF_UNDYING

# Protection = coeurs bonus permanents
protection-hearts:
  enabled: true
  # Coeurs ajoutés par niveau de Protection porté (1 coeur = 2 PV)
  hearts-per-level: 0.5
  # Plafond de coeurs bonus (en plus des 10 de base)
  max-bonus-hearts: 30
