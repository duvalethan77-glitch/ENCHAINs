name: NoLimits
version: ${project.version}
main: com.nolimits.NoLimitsPlugin
api-version: "1.21"
description: Any item, any enchant, no limits.
commands:
  nolimits:
    description: Apply or remove any enchantment on the held item
    usage: /nolimits <enchant> <level> | /nolimits remove <enchant> | /nolimits reload
    aliases: [nl, anyenchant]
    permission: nolimits.use
permissions:
  nolimits.use:
    description: Use the /nolimits command
    default: op
  nolimits.anvil:
    description: Use the unrestricted anvil
    default: true
